name: V2 Authenticated Action Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'test/v2-action-integration.test.mjs'
      - 'test/v2-multi-tenant-boundary.test.mjs'
      - 'test/v2-action-http-integration.test.mjs'
      - 'test/v2-actor-channel-privilege-integration.test.mjs'
      - 'test/v2-channel-tenant-context.test.mjs'
      - 'test/v2-customer-operational-issue-integration.test.mjs'
      - 'test/v2-self-service-onboarding.test.mjs'
      - 'test/customer-operational-issue.test.mjs'
      - 'supabase/v2/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/src/platform/**'
      - 'server/src/routes/**'
      - 'server/src/services/**'
      - 'server/src/index.ts'
      - 'enerlectra-core/src/**'
      - 'client/src/**'
      - '.github/workflows/**'

jobs:
  action-gate:
    runs-on: ubuntu-latest
    env:
      V2_SUPABASE_URL: https://mtyhzvkiuibigjximsix.supabase.co
      V2_SUPABASE_ANON_KEY: ${{ secrets.V2_SUPABASE_ANON_KEY }}
      V2_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require V2 integration secrets
        run: |
          if [ -z "${V2_SUPABASE_ANON_KEY}" ] || [ -z "${V2_SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Repository secrets V2_SUPABASE_ANON_KEY and V2_SUPABASE_SERVICE_ROLE_KEY are required."
            exit 1
          fi

      - name: Run V2 platform and runtime boundary tests
        run: npm test

      - name: Run authenticated V2 Action gate
        run: npm run test:v2:action

      - name: Run V2 Action HTTP gate
        run: npm run test:v2:action-http

      - name: Run V2 multi-tenant boundary gate
        run: npm run test:v2:multi-tenant

      - name: Run V2 Customer Operational Issue gate
        run: npm run test:v2:customer-operational-issue
