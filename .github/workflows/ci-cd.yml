name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24.x'

jobs:
  client:
    name: Client — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  telegram-bot:
    name: Telegram bot — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/telegram-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: integrations/telegram-bot/package-lock.json

      - run: npm ci
      - run: npm run build

  root:
    name: Root — install & smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Audit root dependencies
        run: npm ci && npm audit --audit-level=high

      - name: Audit client dependencies
        working-directory: client
        run: npm ci && npm audit --audit-level=high

      - name: Audit telegram-bot dependencies
        working-directory: integrations/telegram-bot
        run: npm ci && npm audit --audit-level=high

  server-typecheck:
    name: Server — typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck:server

  smoke-production:
    name: Production smoke test
    runs-on: ubuntu-latest
    needs: [client, telegram-bot, root, security, server-typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Backend health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://enerlectra-backend.onrender.com/api/health"; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Backend health check failed after 5 attempts"
          exit 1

      - name: Frontend reachability
        run: curl -fsSI "https://enerlectra-frontend-c406365od-samuel-mandas-projects.vercel.app" | head -n 1
