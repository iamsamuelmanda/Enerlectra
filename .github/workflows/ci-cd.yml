name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24.x'

jobs:
  client:
    name: Client — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  telegram-bot:
    name: Telegram bot — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/telegram-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: integrations/telegram-bot/package-lock.json

      - run: npm ci
      - run: npm run build

  root:
    name: Root — install & smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Audit root dependencies
        run: npm ci && npm audit --audit-level=high

      - name: Audit client dependencies
        working-directory: client
        run: npm ci && npm audit --audit-level=high

      - name: Audit telegram-bot dependencies
        working-directory: integrations/telegram-bot
        run: npm ci && npm audit --audit-level=high

  server-typecheck:
    name: Server — typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck:server

  # Production smoke tests stay disabled until the canonical Render service is cut over.
  # The previous job targeted the retired runtime; reintroduce this gate after cutover.
