name: Provision V2 Enerlectra Actor

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Supabase Auth email to provision"
        required: true
        default: "enerlectra.energy@gmail.com"
        type: string
      role:
        description: "Enerlectra workspace role"
        required: true
        default: "OWNER"
        type: choice
        options:
          - OWNER
          - OPERATOR
          - TECHNICIAN
          - FINANCE
          - VIEWER

permissions:
  contents: read

jobs:
  provision:
    name: Provision V2 actor
    runs-on: ubuntu-latest
    env:
      V2_SUPABASE_URL: https://mtyhzvkiuibigjximsix.supabase.co
      V2_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_ROLE_KEY }}
      ENERLECTRA_ORGANIZATION_ID: 2cd09175-7079-4751-98b7-b3ec6685bc5a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require provisioning secret
        run: |
          if [ -z "${V2_SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Repository secret V2_SUPABASE_SERVICE_ROLE_KEY is required."
            exit 1
          fi

      - name: Provision actor and membership
        run: |
          npm run provision:v2:actor -- \
            --email "${{ inputs.email }}" \
            --organization-id "${ENERLECTRA_ORGANIZATION_ID}" \
            --role "${{ inputs.role }}"
