services:
  - type: web
    name: enerlectra-ellie-bot
    env: node
    plan: free
    rootDir: integrations/enerlectra-bot
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    healthCheckPath: /
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: WEBHOOK_URL
        value: https://enerlectra-ellie-bot.onrender.com

  - type: web
    name: enerlectra-backend
    env: node
    plan: free
    buildCommand: "npm ci && npm run build:client"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://enerlectra-frontend-c406365od-samuel-mandas-projects.vercel.app,http://localhost:3000
      - key: V2_SUPABASE_URL
        value: https://mtyhzvkiuibigjximsix.supabase.co
      - key: V2_SUPABASE_ANON_KEY
        sync: false
      - key: V2_SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: false # V2 cutover is manual; do not replace the live V1 runtime on merge.
    branch: main
